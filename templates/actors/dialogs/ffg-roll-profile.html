<div class="dialog-content roll-profile-dialog">
  <p class="roll-profile-hint">{{localize "SWFFG.RollProfile.Hint"}}</p>

  {{#if profiles.length}}
  <div class="roll-profile-row">
    <label for="roll-profile-load">{{localize "SWFFG.RollProfile.SavedProfiles"}}</label>
    <select id="roll-profile-load" class="roll-profile-load">
      <option value="">{{localize "SWFFG.RollProfile.NoProfile"}}</option>
      {{#each profiles}}
      <option value="{{this.id}}">{{this.label}}{{#if this.summary}} &mdash; {{this.summary}}{{/if}}</option>
      {{/each}}
    </select>
    <button type="button" class="roll-profile-delete" title="{{localize "SWFFG.RollProfile.DeleteProfileHint"}}" disabled>
      <i class="fas fa-trash"></i> {{localize "SWFFG.RollProfile.DeleteProfile"}}
    </button>
  </div>
  {{/if}}

  <div class="roll-profile-row">
    <label for="roll-profile-skill">{{localize "SWFFG.RollProfile.Skill"}}</label>
    <select id="roll-profile-skill" class="roll-profile-skill">
      <option value="">{{autoSkillLabel}}</option>
      {{#each skills}}
      <option value="{{this.key}}" {{#if this.selected}}selected{{/if}}>{{this.label}}</option>
      {{/each}}
    </select>
  </div>

  <div class="roll-profile-row">
    <label for="roll-profile-characteristic">{{localize "SWFFG.RollProfile.Characteristic"}}</label>
    <select id="roll-profile-characteristic" class="roll-profile-characteristic">
      <option value="">{{autoCharacteristicLabel}}</option>
      {{#each characteristics}}
      <option value="{{this.key}}" {{#if this.selected}}selected{{/if}}>{{this.label}}</option>
      {{/each}}
    </select>
  </div>

  <div class="roll-profile-row">
    <label for="roll-profile-save-as">{{localize "SWFFG.RollProfile.SaveAs"}}</label>
    <input type="text" id="roll-profile-save-as" class="roll-profile-save-as" placeholder="{{localize "SWFFG.RollProfile.SaveAsPlaceholder"}}" />
  </div>
</div>
